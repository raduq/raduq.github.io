    <script>
      (function () {
        const lightThemes = ['light-sakura', 'light-ocean', 'light-meadow', 'light-sunset'];
        const darkThemes = ['neon-cyberpunk', 'neon-electric', 'neon-magenta', 'neon-aurora'];
        const savedMode = localStorage.getItem('theme');
        const savedLightTheme = localStorage.getItem('lightTheme');
        const savedDarkTheme = localStorage.getItem('neonTheme');
        const prefersLight = !window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isLight = savedMode === 'light' || (savedMode === null && prefersLight);
        const theme = isLight
          ? (lightThemes.includes(savedLightTheme) ? savedLightTheme : lightThemes[0])
          : (darkThemes.includes(savedDarkTheme) ? savedDarkTheme : darkThemes[0]);

        document.documentElement.classList.add(isLight ? 'light-mode' : 'dark-mode', theme);
      })();
